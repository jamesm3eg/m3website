# Deploys this site to GitHub Pages as plain static files.
#
# This replaces the legacy "pages build and deployment" builder, which runs
# Jekyll and can hang or time out. Nothing here is built or transformed: the
# repository is uploaded exactly as it sits.
#
# To use it: Settings -> Pages -> Source -> "GitHub Actions".
# Then push, or run it by hand from the Actions tab (Run workflow).

name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, so queued runs
# don't pile up and cancel each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site as-is
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
